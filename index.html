<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coin999-回歸帳號排程</title>

    <style>
        :root {
            --bg: #f4f7fb;
            --card: #ffffff;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
            --today: #fff7ed;
            --event: #dbeafe;
            --event-text: #1e40af;
            --danger: #fee2e2;
            --danger-text: #991b1b;
            --success: #dcfce7;
            --success-text: #166534;
            --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Microsoft JhengHei",
                "Noto Sans TC",
                sans-serif;
            background: linear-gradient(135deg, #eff6ff, #f8fafc);
            color: var(--text);
        }

        .page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 28px 18px 48px;
        }

        .header {
            margin-bottom: 22px;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 32px;
            letter-spacing: 0.5px;
        }

        .header p {
            margin: 0;
            color: var(--muted);
            font-size: 15px;
        }

        .panel {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 22px;
            margin-bottom: 22px;
        }

        .panel-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .panel-title h2 {
            margin: 0;
            font-size: 22px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
            background: var(--success);
            color: var(--success-text);
            white-space: nowrap;
        }

        .week-return-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
        }

        .return-card {
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 14px;
            background: #f8fafc;
        }

        .return-card .name {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 8px;
            color: var(--primary-dark);
        }

        .return-card .meta {
            display: grid;
            gap: 4px;
            font-size: 14px;
            color: var(--text);
        }

        .return-card .meta span {
            color: var(--muted);
        }

        .leave-date {
            display: inline-block;
            margin-top: 8px;
            padding: 5px 8px;
            border-radius: 8px;
            background: var(--danger);
            color: var(--danger-text);
            font-weight: 700;
            font-size: 13px;
        }

        .empty {
            color: var(--muted);
            padding: 12px 0;
        }

        .calendar-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .calendar-title {
            font-size: 26px;
            font-weight: 900;
        }

        .toolbar-buttons {
            display: flex;
            gap: 8px;
        }

        button {
            border: 0;
            background: var(--primary);
            color: white;
            padding: 10px 14px;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s ease;
            font-family: inherit;
        }

        button:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        button.secondary {
            background: #e5e7eb;
            color: #111827;
        }

        button.secondary:hover {
            background: #d1d5db;
        }

        .calendar {
            border: 1px solid var(--border);
            border-radius: 18px;
            overflow: hidden;
            background: white;
        }

        .weekdays,
        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
        }

        .weekday {
            background: #f1f5f9;
            padding: 12px 8px;
            text-align: center;
            font-weight: 900;
            color: #334155;
            border-bottom: 1px solid var(--border);
        }

        .day {
            min-height: 135px;
            padding: 10px;
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            position: relative;
            background: white;
        }

        .day:nth-child(7n) {
            border-right: 0;
        }

        .day.other-month {
            background: #f8fafc;
            color: #cbd5e1;
        }

        .day.today {
            background: var(--today);
            box-shadow: inset 0 0 0 2px #fb923c;
        }

        .day-number {
            font-weight: 900;
            font-size: 15px;
            margin-bottom: 8px;
        }

        .event {
            background: var(--event);
            color: var(--event-text);
            padding: 6px 7px;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 800;
            margin-bottom: 5px;
            line-height: 1.35;
            cursor: default;
        }

        .event small {
            display: block;
            color: #475569;
            font-weight: 600;
            margin-top: 2px;
        }

        .legend {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 14px;
            color: var(--muted);
            font-size: 14px;
        }

        .legend-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 4px;
            display: inline-block;
        }

        .dot.event-dot {
            background: var(--event);
            border: 1px solid #93c5fd;
        }

        .dot.today-dot {
            background: var(--today);
            border: 1px solid #fb923c;
        }

        @media (max-width: 720px) {
            body {
                background: #f8fafc;
            }

            .page {
                width: 100%;
                max-width: none;
                padding: 14px 8px 28px;
            }

            .header {
                margin-bottom: 14px;
                padding: 0 4px;
            }

            .header h1 {
                font-size: 24px;
                margin-bottom: 6px;
            }

            .header p {
                font-size: 13px;
                line-height: 1.45;
            }

            .panel {
                padding: 12px;
                border-radius: 14px;
                margin-bottom: 14px;
            }

            .panel-title {
                align-items: flex-start;
                flex-direction: column;
                gap: 8px;
                margin-bottom: 10px;
            }

            .panel-title h2 {
                font-size: 19px;
            }

            .badge {
                font-size: 12px;
                padding: 5px 9px;
            }

            .week-return-list {
                grid-template-columns: 1fr;
                gap: 8px;
            }

            .return-card {
                padding: 11px;
                border-radius: 12px;
            }

            .return-card .name {
                font-size: 18px;
                margin-bottom: 6px;
            }

            .return-card .meta {
                font-size: 13px;
                gap: 3px;
            }

            .leave-date {
                font-size: 12px;
                padding: 4px 7px;
            }

            .calendar-toolbar {
                gap: 10px;
                margin-bottom: 10px;
            }

            .calendar-title {
                width: 100%;
                font-size: 21px;
                line-height: 1.2;
            }

            .toolbar-buttons {
                width: 100%;
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 6px;
            }

            button {
                width: 100%;
                padding: 8px 6px;
                border-radius: 9px;
                font-size: 13px;
            }

            .calendar {
                border-radius: 12px;
            }

            .weekday {
                padding: 7px 2px;
                font-size: 12px;
                line-height: 1;
            }

            .day {
                min-height: 52px;
                padding: 4px 3px;
            }

            .day-number {
                font-size: 12px;
                margin-bottom: 3px;
                line-height: 1;
            }

            .event {
                padding: 3px 4px;
                border-radius: 6px;
                font-size: 10px;
                line-height: 1.2;
                margin-bottom: 3px;
                word-break: keep-all;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .calendar .event small {
                display: none;
            }

            .day.today {
                box-shadow: inset 0 0 0 1.5px #fb923c;
            }

            .legend {
                margin-top: 10px;
                font-size: 12px;
                gap: 8px;
            }

            .dot {
                width: 10px;
                height: 10px;
                border-radius: 3px;
            }
        }

        @media (max-width: 430px) {
            .page {
                padding: 10px 5px 24px;
            }

            .panel {
                padding: 9px;
                border-radius: 12px;
            }

            .header h1 {
                font-size: 22px;
            }

            .header p {
                font-size: 12px;
            }

            .calendar-title {
                font-size: 19px;
            }

            .weekday {
                font-size: 11px;
                padding: 6px 1px;
            }

            .day {
                min-height: 48px;
                padding: 3px 2px;
            }

            .day-number {
                font-size: 11px;
                margin-bottom: 2px;
            }

            .event {
                font-size: 9px;
                padding: 2px 3px;
                border-radius: 5px;
                margin-bottom: 2px;
            }

            button {
                font-size: 12px;
                padding: 7px 4px;
            }
        }

        /* ===== 特殊活動 / 個人版本提示 ===== */

        .event.special {
            background: #fef3c7;
            color: #92400e;
        }

        .dot.special-dot {
            background: #fef3c7;
            border: 1px solid #f59e0b;
        }

        .tag {
            display: inline-block;
            margin-left: 6px;
            padding: 2px 6px;
            border-radius: 6px;
            background: #fef3c7;
            color: #92400e;
            font-size: 12px;
            font-weight: 700;
            vertical-align: middle;
        }

        .badge.custom {
            background: #fef3c7;
            color: #92400e;
        }

        .notice {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 22px;
            padding: 12px 16px;
            border-radius: 14px;
            background: #fffbeb;
            border: 1px solid #fcd34d;
            color: #92400e;
            font-size: 14px;
            font-weight: 600;
        }

        .notice.show {
            display: flex;
        }

        /* ===== 排程編輯器 ===== */

        .editor-hint {
            margin: 0 0 14px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
        }

        .editor-settings {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 16px;
        }

        .field {
            display: grid;
            gap: 4px;
            font-size: 13px;
            color: var(--muted);
            font-weight: 700;
        }

        .field input,
        .field select,
        .member-row input,
        .member-row select {
            width: 100%;
            min-width: 0;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font: inherit;
            font-size: 14px;
            color: var(--text);
            background: white;
        }

        .editor-groups {
            display: grid;
            gap: 12px;
        }

        .editor-group {
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 14px;
            background: #f8fafc;
        }

        .editor-group-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .editor-group-head h3 {
            margin: 0;
            font-size: 17px;
        }

        .editor-group-head .next {
            color: var(--muted);
            font-size: 13px;
            font-weight: 600;
            margin-left: 8px;
        }

        .member-head,
        .member-row {
            display: grid;
            grid-template-columns: 1.1fr 1.2fr 1fr 1.8fr 0.8fr auto;
            gap: 8px;
            align-items: center;
        }

        .member-head {
            font-size: 12px;
            font-weight: 700;
            color: var(--muted);
            padding: 0 2px 6px;
        }

        .member-row {
            margin-bottom: 8px;
        }

        button.small {
            padding: 7px 10px;
            border-radius: 10px;
            font-size: 13px;
        }

        button.danger {
            background: var(--danger);
            color: var(--danger-text);
        }

        button.danger:hover {
            background: #fecaca;
        }

        .editor-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 16px;
        }

        .editor-message {
            margin-top: 10px;
            font-size: 14px;
            font-weight: 700;
            white-space: pre-line;
        }

        .editor-message.error {
            color: var(--danger-text);
        }

        .editor-message.ok {
            color: var(--success-text);
        }

        details.editor summary {
            cursor: pointer;
            font-weight: 800;
            font-size: 15px;
            color: var(--primary-dark);
            margin-bottom: 12px;
        }

        @media (max-width: 720px) {
            .member-head {
                display: none;
            }

            .member-row {
                grid-template-columns: 1fr 1fr;
                padding: 10px;
                border: 1px solid var(--border);
                border-radius: 12px;
                background: white;
            }

            .member-row .skip-input {
                grid-column: 1 / -1;
            }

            .editor-actions button {
                width: auto;
                flex: 1 1 40%;
            }
        }
    </style>
</head>

<body>
    <main class="page">
        <section class="header">
            <h1>回歸帳號萬年曆</h1>
            <p>依照第一次回歸日期自動輪組，並計算本週回歸、下次回歸與最晚可離開時間。</p>
        </section>

        <div class="notice" id="customNotice">
            <span>你正在看自己修改過的排程，只存在這台裝置的瀏覽器，其他人看不到。</span>
            <button class="secondary small" onclick="resetToDefault()">還原成共用版本</button>
        </div>

        <section class="panel">
            <div class="panel-title">
                <h2>本週回歸</h2>
                <span class="badge" id="currentWeekRange">計算中</span>
            </div>

            <div id="weekReturnList" class="week-return-list"></div>
        </section>

        <section class="panel">
            <div class="calendar-toolbar">
                <div class="calendar-title" id="calendarTitle"></div>

                <div class="toolbar-buttons">
                    <button class="secondary" onclick="changeMonth(-1)">上個月</button>
                    <button onclick="goToday()">回到本月</button>
                    <button class="secondary" onclick="changeMonth(1)">下個月</button>
                </div>
            </div>

            <div class="calendar">
                <div class="weekdays">
                    <div class="weekday">日</div>
                    <div class="weekday">一</div>
                    <div class="weekday">二</div>
                    <div class="weekday">三</div>
                    <div class="weekday">四</div>
                    <div class="weekday">五</div>
                    <div class="weekday">六</div>
                </div>

                <div class="days" id="calendarDays"></div>
            </div>

            <div class="legend">
                <span class="legend-item">
                    <span class="dot event-dot"></span>
                    回歸日
                </span>

                <span class="legend-item">
                    <span class="dot special-dot"></span>
                    單次活動
                </span>

                <span class="legend-item">
                    <span class="dot today-dot"></span>
                    今日
                </span>
            </div>
        </section>

        <section class="panel">
            <div class="panel-title">
                <h2>排程設定</h2>
                <span class="badge" id="dataSourceBadge">共用版本</span>
            </div>

            <p class="editor-hint">
                每一組會依序每週輪一次（6 組就是每 6 週回歸一次）。
                在這裡修改後按「儲存」，只會存在你自己的瀏覽器，其他人看到的還是共用版本。
                想把修改給別人或換裝置，用「匯出 JSON」再「匯入 JSON」。
            </p>

            <details class="editor" id="editorDetails">
                <summary>展開編輯排程</summary>

                <div class="editor-settings">
                    <label class="field">
                        第 1 組第一次輪到的日期（週一）
                        <input type="date" id="setStartDate" />
                    </label>
                    <label class="field">
                        兩次回歸至少間隔（天）
                        <input type="number" min="0" id="setMinGap" />
                    </label>
                    <label class="field">
                        最晚離開＝下次回歸前幾天
                        <input type="number" min="0" id="setLeaveBefore" />
                    </label>
                </div>

                <div class="editor-groups" id="editorGroups"></div>

                <div class="editor-actions">
                    <button class="secondary" onclick="addGroup()">＋ 新增組別</button>
                    <button onclick="saveDraft()">儲存（只有我看得到）</button>
                    <button class="secondary" onclick="discardDraft()">放棄未儲存的修改</button>
                    <button class="secondary" onclick="exportData()">匯出 JSON</button>
                    <button class="secondary" onclick="document.getElementById('importFile').click()">匯入 JSON</button>
                    <button class="danger" onclick="resetToDefault()">還原成共用版本</button>
                    <input type="file" id="importFile" accept=".json,application/json" hidden onchange="importData(event)" />
                </div>

                <div class="editor-message" id="editorMessage"></div>
            </details>
        </section>
    </main>

    <script>
        const fixedToday = new Date();

        let currentYear = fixedToday.getFullYear();
        let currentMonth = fixedToday.getMonth();

        let groups = [];
        let schedule = [];

        const BASE_SETTINGS = {
            startDate: "2026/08/03",
            generateWeeks: 80,
            minEnterGapDays: 30,
            leaveBeforeNextDays: 31
        };

        // 使用者自己的修改只存在各自瀏覽器的 localStorage，不會影響 data.json
        const STORAGE_KEY = "returnCalendar.myData.v1";

        let settings = { ...BASE_SETTINGS };
        let defaultData = null;
        let usingCustom = false;
        let draft = null;

        async function loadJsonData() {
            try {
                const response = await fetch("./data.json", {
                    cache: "no-store"
                });

                if (!response.ok) {
                    throw new Error(`讀取 data.json 失敗，HTTP 狀態：${response.status}`);
                }

                defaultData = await response.json();
            } catch (error) {
                console.error(error);
            }

            const customData = readCustomData();
            const data = customData || defaultData;

            if (!data) {
                document.getElementById("weekReturnList").innerHTML = `
        <div class="empty">
          無法讀取 data.json，請確認檔案是否存在，且是否透過本機伺服器開啟。
        </div>
      `;
                return;
            }

            usingCustom = Boolean(customData);
            applyData(data);
        }

        function applyData(data) {
            settings = {
                ...BASE_SETTINGS,
                ...(data.settings || {})
            };

            groups = data.groups || [];

            schedule = generateScheduleByGroups();

            renderCurrentWeekReturns();
            renderCalendar();
            renderSourceState();
            loadDraftFromCurrent();
        }

        function readCustomData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : null;
            } catch (error) {
                console.warn("讀取個人排程失敗：", error);
                return null;
            }
        }

        function writeCustomData(data) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                return true;
            } catch (error) {
                console.warn("儲存個人排程失敗：", error);
                return false;
            }
        }

        function clearCustomData() {
            try {
                localStorage.removeItem(STORAGE_KEY);
            } catch (error) {
                console.warn("清除個人排程失敗：", error);
            }
        }

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        function parseDate(dateString) {
            const [year, month, day] = dateString.split("/").map(Number);
            return new Date(year, month - 1, day);
        }

        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, "0");
            const day = String(date.getDate()).padStart(2, "0");

            return `${year}/${month}/${day}`;
        }

        function formatDateWithWeekday(date) {
            const weekdays = ["日", "一", "二", "三", "四", "五", "六"];
            return `${formatDate(date)}（${weekdays[date.getDay()]}）`;
        }

        function addDays(date, days) {
            const result = new Date(date);
            result.setDate(result.getDate() + days);
            return result;
        }

        function getStartOfWeek(date) {
            const result = new Date(date);
            const day = result.getDay();
            const diffToMonday = day === 0 ? -6 : 1 - day;

            result.setDate(result.getDate() + diffToMonday);
            result.setHours(0, 0, 0, 0);

            return result;
        }

        function getEndOfWeek(date) {
            const result = getStartOfWeek(date);
            result.setDate(result.getDate() + 7);
            result.setHours(0, 0, 0, 0);

            return result;
        }

        function getDayDiff(dateA, dateB) {
            const oneDay = 24 * 60 * 60 * 1000;

            const cleanA = new Date(
                dateA.getFullYear(),
                dateA.getMonth(),
                dateA.getDate()
            );

            const cleanB = new Date(
                dateB.getFullYear(),
                dateB.getMonth(),
                dateB.getDate()
            );

            return Math.round((cleanA - cleanB) / oneDay);
        }

        function validateStartDateIsMonday() {
            const startDate = parseDate(settings.startDate);

            if (startDate.getDay() !== 1) {
                console.warn("settings.startDate 不是週一，目前日期：", settings.startDate);
            }
        }

        function validateGroups() {
            if (!groups.length) {
                console.warn("data.json 裡沒有 groups 資料。");
                return;
            }

            if (groups.length !== 6) {
                console.warn(`目前 groups 不是 6 組，而是 ${groups.length} 組：`, groups);
            }

            groups.forEach((group, groupIndex) => {
                if (!Array.isArray(group)) {
                    console.warn(`第 ${groupIndex + 1} 組不是陣列：`, group);
                    return;
                }

                // 移除原先寫死 2 人的警告，改為檢查至少有成員
                if (group.length === 0) {
                    console.warn(`第 ${groupIndex + 1} 組沒有任何成員`);
                }

                group.forEach(member => {
                    if (!member.account || !member.enterDate) {
                        console.warn(
                            `第 ${groupIndex + 1} 組有成員缺少 account 或 enterDate：`,
                            member
                        );
                    }
                });
            });
        }

        function generateScheduleByGroups() {
            validateStartDateIsMonday();
            validateGroups();

            if (!groups.length) {
                return [];
            }

            const generated = [];
            const lastEnterMap = {};

            const startDate = parseDate(settings.startDate);
            const totalWeeks = Number(settings.generateWeeks || 80);

            for (let weekIndex = 0; weekIndex < totalWeeks; weekIndex++) {
                const groupIndex = weekIndex % groups.length;
                const group = groups[groupIndex];

                const scheduleDateObj = addDays(startDate, weekIndex * 7);
                const scheduleDate = formatDate(scheduleDateObj);

                if (!Array.isArray(group)) {
                    continue;
                }

                group.forEach(member => {
                    if (!member.account || !member.enterDate) {
                        return;
                    }

                    const firstEnterDateObj = parseDate(member.enterDate);

                    // 1. 尚未到該帳號的首次開放日期
                    if (scheduleDateObj < firstEnterDateObj) {
                        return;
                    }

                    // 2. 支援單次限定活動（如黑五限定支援）
                    if (member.endDate && scheduleDate !== member.endDate) {
                        return;
                    }

                    // 3. 跳過指定的冷卻衝突日期（如黑五前夕不可出勤）
                    if (Array.isArray(member.skipDates) && member.skipDates.includes(scheduleDate)) {
                        return;
                    }

                    // 4. 個別日期調整（例如該週改成週二才回歸）
                    const actualDate =
                        (member.moveDates && member.moveDates[scheduleDate]) || scheduleDate;
                    const actualDateObj = parseDate(actualDate);

                    const lastEnterDate = lastEnterMap[member.account];

                    if (lastEnterDate) {
                        const gapDays = getDayDiff(actualDateObj, lastEnterDate);

                        if (gapDays <= settings.minEnterGapDays) {
                            console.warn(
                                `${member.account} 的進入間隔只有 ${gapDays} 天，未超過 ${settings.minEnterGapDays} 天`,
                                {
                                    account: member.account,
                                    previous: formatDate(lastEnterDate),
                                    current: actualDate
                                }
                            );
                        }
                    }

                    generated.push({
                        account: member.account,
                        enterDate: actualDate,
                        special: Boolean(member.endDate),
                        note: member.note || ""
                    });

                    lastEnterMap[member.account] = actualDateObj;
                });
            }

            return generated.sort((a, b) => {
                const dateDiff = parseDate(a.enterDate) - parseDate(b.enterDate);

                if (dateDiff !== 0) {
                    return dateDiff;
                }

                return a.account.localeCompare(b.account, "zh-Hant");
            });
        }

        function calculateNextEnterDate(account, currentEnterDate) {
            const currentDate = parseDate(currentEnterDate);

            const futureRecord = schedule
                .filter(item => {
                    if (item.account !== account) return false;

                    const itemDate = parseDate(item.enterDate);
                    return itemDate > currentDate;
                })
                .sort((a, b) => parseDate(a.enterDate) - parseDate(b.enterDate))[0];

            if (futureRecord) {
                return parseDate(futureRecord.enterDate);
            }

            const cycleDays = groups.length * 7;
            return addDays(currentDate, cycleDays);
        }

        function getScheduleDetail(account, currentEnterDate) {
            const nextEnterDate = calculateNextEnterDate(account, currentEnterDate);
            const latestLeaveDate = addDays(
                nextEnterDate,
                -settings.leaveBeforeNextDays
            );

            return {
                nextEnterDate,
                latestLeaveDate
            };
        }

        function renderCurrentWeekReturns() {
            const start = getStartOfWeek(fixedToday);
            const end = getEndOfWeek(fixedToday);

            document.getElementById("currentWeekRange").textContent =
                `${formatDate(start)} - ${formatDate(end)}`;

            const weekReturns = schedule
                .filter(item => {
                    const enterDate = parseDate(item.enterDate);
                    return enterDate >= start && enterDate < end;
                })
                .sort((a, b) => parseDate(a.enterDate) - parseDate(b.enterDate));

            const container = document.getElementById("weekReturnList");
            container.innerHTML = "";

            if (weekReturns.length === 0) {
                container.innerHTML = `<div class="empty">本週沒有回歸帳號。</div>`;
                return;
            }

            weekReturns.forEach(item => {
                const detail = getScheduleDetail(item.account, item.enterDate);

                const card = document.createElement("div");
                card.className = "return-card";

                card.innerHTML = `
        <div class="name">${escapeHtml(item.account)}${item.special ? `<span class="tag">${escapeHtml(item.note || "單次活動")}</span>` : ""}</div>

        <div class="meta">
          <div>
            <span>回歸日期：</span>${formatDateWithWeekday(parseDate(item.enterDate))}
          </div>

          <div>
            <span>下次回歸：</span>${formatDateWithWeekday(detail.nextEnterDate)}
          </div>
        </div>

        <div class="leave-date">
          最晚可離開：${formatDateWithWeekday(detail.latestLeaveDate)}
        </div>
      `;

                container.appendChild(card);
            });
        }

        function getEventsByDate(dateString) {
            return schedule.filter(item => item.enterDate === dateString);
        }

        function renderCalendar() {
            const calendarTitle = document.getElementById("calendarTitle");
            const calendarDays = document.getElementById("calendarDays");

            calendarTitle.textContent = `${currentYear} 年 ${currentMonth + 1} 月`;
            calendarDays.innerHTML = "";

            const firstDayOfMonth = new Date(currentYear, currentMonth, 1);
            const lastDayOfMonth = new Date(currentYear, currentMonth + 1, 0);

            const startDay = firstDayOfMonth.getDay();
            const daysInMonth = lastDayOfMonth.getDate();

            const prevMonthLastDate = new Date(currentYear, currentMonth, 0).getDate();
            const totalCells = 42;

            for (let i = 0; i < totalCells; i++) {
                const dayCell = document.createElement("div");
                dayCell.className = "day";

                let cellDate;
                let dayNumber;

                if (i < startDay) {
                    dayNumber = prevMonthLastDate - startDay + i + 1;
                    cellDate = new Date(currentYear, currentMonth - 1, dayNumber);
                    dayCell.classList.add("other-month");
                } else if (i >= startDay + daysInMonth) {
                    dayNumber = i - startDay - daysInMonth + 1;
                    cellDate = new Date(currentYear, currentMonth + 1, dayNumber);
                    dayCell.classList.add("other-month");
                } else {
                    dayNumber = i - startDay + 1;
                    cellDate = new Date(currentYear, currentMonth, dayNumber);
                }

                const cellDateString = formatDate(cellDate);

                if (
                    cellDate.getFullYear() === fixedToday.getFullYear() &&
                    cellDate.getMonth() === fixedToday.getMonth() &&
                    cellDate.getDate() === fixedToday.getDate()
                ) {
                    dayCell.classList.add("today");
                }

                const dayNumberDiv = document.createElement("div");
                dayNumberDiv.className = "day-number";
                dayNumberDiv.textContent = dayNumber;
                dayCell.appendChild(dayNumberDiv);

                const events = getEventsByDate(cellDateString);

                events.forEach(event => {
                    const detail = getScheduleDetail(event.account, event.enterDate);

                    const eventDiv = document.createElement("div");
                    eventDiv.className = event.special ? "event special" : "event";

                    eventDiv.innerHTML = `
          ${escapeHtml(event.account)} 回歸${event.special ? `（${escapeHtml(event.note || "活動")}）` : ""}
          <small>下次：${formatDate(detail.nextEnterDate)}</small>
          <small>最晚離開：${formatDate(detail.latestLeaveDate)}</small>
        `;

                    dayCell.appendChild(eventDiv);
                });

                calendarDays.appendChild(dayCell);
            }
        }

        function changeMonth(offset) {
            currentMonth += offset;

            if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }

            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            }

            renderCalendar();
        }

        function goToday() {
            currentYear = fixedToday.getFullYear();
            currentMonth = fixedToday.getMonth();

            renderCalendar();
        }

        // ===== 排程編輯器 =====

        function renderSourceState() {
            const badge = document.getElementById("dataSourceBadge");
            badge.textContent = usingCustom ? "我的版本（只有我看得到）" : "共用版本";
            badge.classList.toggle("custom", usingCustom);
            document.getElementById("customNotice").classList.toggle("show", usingCustom);
        }

        function loadDraftFromCurrent() {
            draft = JSON.parse(JSON.stringify({ settings, groups }));
            renderEditor();
        }

        function toInputDate(dateString) {
            return dateString ? dateString.replace(/\//g, "-") : "";
        }

        function fromInputDate(value) {
            return value ? value.replace(/-/g, "/") : "";
        }

        function normalizeDateText(text) {
            const match = String(text).trim().match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);
            if (!match) return null;

            const date = new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
            if (date.getMonth() !== Number(match[2]) - 1) return null;

            return formatDate(date);
        }

        // 該組在今天之後（含本週）下一次輪到的日期
        function getNextGroupDate(groupIndex, groupCount, startDateString) {
            const startDate = parseDate(startDateString);
            const cycleDays = groupCount * 7;
            let date = addDays(startDate, groupIndex * 7);
            const weekStart = getStartOfWeek(fixedToday);

            if (date < weekStart) {
                const cycles = Math.ceil(getDayDiff(weekStart, date) / cycleDays);
                date = addDays(date, cycles * cycleDays);
            }

            return date;
        }

        function setEditorMessage(text, type) {
            const el = document.getElementById("editorMessage");
            el.textContent = text;
            el.className = `editor-message ${type || ""}`;
        }

        function renderEditor() {
            if (!draft) return;

            document.getElementById("setStartDate").value = toInputDate(draft.settings.startDate);
            document.getElementById("setMinGap").value = draft.settings.minEnterGapDays;
            document.getElementById("setLeaveBefore").value = draft.settings.leaveBeforeNextDays;

            const container = document.getElementById("editorGroups");
            container.innerHTML = "";

            const groupCount = draft.groups.length;

            draft.groups.forEach((group, gi) => {
                const box = document.createElement("div");
                box.className = "editor-group";

                const nextDate = draft.settings.startDate
                    ? formatDateWithWeekday(getNextGroupDate(gi, groupCount, draft.settings.startDate))
                    : "-";

                box.innerHTML = `
          <div class="editor-group-head">
            <h3>第 ${gi + 1} 組<span class="next">下次輪到：${nextDate}</span></h3>
            <div class="toolbar-buttons">
              <button class="secondary small" data-action="add-member">＋ 新增帳號</button>
              <button class="danger small" data-action="remove-group">刪除此組</button>
            </div>
          </div>
          <div class="member-head">
            <span>帳號</span><span>首次回歸日</span><span>類型</span>
            <span>跳過日期（逗號分隔）</span><span>移到組別</span><span></span>
          </div>
        `;

                box.querySelector('[data-action="add-member"]').onclick = () => {
                    group.push({ account: "", enterDate: formatDate(getNextGroupDate(gi, groupCount, draft.settings.startDate)) });
                    renderEditor();
                };

                box.querySelector('[data-action="remove-group"]').onclick = () => {
                    if (group.length && !confirm(`第 ${gi + 1} 組還有 ${group.length} 個帳號，確定要刪除整組嗎？`)) return;
                    draft.groups.splice(gi, 1);
                    renderEditor();
                };

                group.forEach((member, mi) => {
                    box.appendChild(buildMemberRow(member, gi, mi, groupCount));
                });

                container.appendChild(box);
            });
        }

        function buildMemberRow(member, gi, mi, groupCount) {
            const row = document.createElement("div");
            row.className = "member-row";

            const groupOptions = Array.from({ length: groupCount }, (_, i) =>
                `<option value="${i}" ${i === gi ? "selected" : ""}>第 ${i + 1} 組</option>`
            ).join("");

            row.innerHTML = `
        <input type="text" placeholder="帳號名稱" value="${escapeHtml(member.account || "")}" data-field="account" />
        <input type="date" value="${toInputDate(member.enterDate)}" data-field="enterDate" />
        <select data-field="type">
          <option value="regular" ${member.endDate ? "" : "selected"}>固定輪回歸</option>
          <option value="once" ${member.endDate ? "selected" : ""}>只回歸這一次</option>
        </select>
        <input type="text" class="skip-input" placeholder="例：2026/10/26, 2026/12/07"
          value="${escapeHtml(member.skipDatesText !== undefined ? member.skipDatesText : (member.skipDates || []).join(", "))}" data-field="skipDates" />
        <select data-field="group">${groupOptions}</select>
        <button class="danger small" data-action="remove">刪除</button>
      `;

            row.querySelector('[data-field="account"]').oninput = (e) => {
                member.account = e.target.value.trim();
            };

            row.querySelector('[data-field="enterDate"]').onchange = (e) => {
                member.enterDate = fromInputDate(e.target.value);
                if (member.endDate) member.endDate = member.enterDate;
            };

            row.querySelector('[data-field="type"]').onchange = (e) => {
                if (e.target.value === "once") {
                    member.endDate = member.enterDate;
                } else {
                    delete member.endDate;
                }
            };

            row.querySelector('[data-field="skipDates"]').oninput = (e) => {
                member.skipDatesText = e.target.value;
            };

            row.querySelector('[data-field="group"]').onchange = (e) => {
                const target = Number(e.target.value);
                draft.groups[gi].splice(mi, 1);
                draft.groups[target].push(member);
                renderEditor();
            };

            row.querySelector('[data-action="remove"]').onclick = () => {
                draft.groups[gi].splice(mi, 1);
                renderEditor();
            };

            return row;
        }

        ["setStartDate", "setMinGap", "setLeaveBefore"].forEach(id => {
            document.getElementById(id).addEventListener("change", () => {
                if (!draft) return;
                readSettingsInputs();
                renderEditor();
            });
        });

        function readSettingsInputs() {
            draft.settings.startDate = fromInputDate(document.getElementById("setStartDate").value);
            draft.settings.minEnterGapDays = Number(document.getElementById("setMinGap").value || 0);
            draft.settings.leaveBeforeNextDays = Number(document.getElementById("setLeaveBefore").value || 0);
        }

        // 檢查並整理草稿，回傳可存檔的資料或錯誤清單
        function buildDataFromDraft() {
            readSettingsInputs();

            const errors = [];

            if (!normalizeDateText(draft.settings.startDate || "")) {
                errors.push("請填寫第 1 組第一次輪到的日期。");
            } else if (parseDate(draft.settings.startDate).getDay() !== 1) {
                errors.push("第 1 組第一次輪到的日期必須是週一。");
            }

            if (!draft.groups.length) {
                errors.push("至少要有一組。");
            }

            const cleanGroups = draft.groups.map((group, gi) => group.map((member, mi) => {
                const label = `第 ${gi + 1} 組第 ${mi + 1} 列`;
                const clean = { ...member };

                if (!clean.account) errors.push(`${label}：帳號名稱不能空白。`);
                if (!clean.enterDate || !normalizeDateText(clean.enterDate)) errors.push(`${label}：請選擇首次回歸日。`);

                if (clean.skipDatesText !== undefined) {
                    const parts = clean.skipDatesText.split(/[,，\s]+/).filter(Boolean);
                    const dates = parts.map(normalizeDateText);
                    const bad = parts.filter((_, i) => !dates[i]);

                    if (bad.length) errors.push(`${label}：跳過日期格式錯誤（${bad.join("、")}），請用 2026/10/26 格式。`);

                    clean.skipDates = dates.filter(Boolean);
                    delete clean.skipDatesText;
                }

                if (!clean.skipDates || !clean.skipDates.length) delete clean.skipDates;

                return clean;
            }));

            return {
                errors,
                data: {
                    settings: { ...settings, ...draft.settings },
                    groups: cleanGroups
                }
            };
        }

        function saveDraft() {
            const { errors, data } = buildDataFromDraft();

            if (errors.length) {
                setEditorMessage(errors.join("\n"), "error");
                return;
            }

            if (!writeCustomData(data)) {
                setEditorMessage("瀏覽器不允許儲存（可能是無痕模式），這次修改只在重新整理前有效。", "error");
            } else {
                setEditorMessage("已儲存。這份排程只有你在這台裝置看得到。", "ok");
            }

            usingCustom = true;
            applyData(data);
        }

        function discardDraft() {
            loadDraftFromCurrent();
            setEditorMessage("已放棄未儲存的修改。", "ok");
        }

        function resetToDefault() {
            if (!defaultData) {
                setEditorMessage("讀不到共用的 data.json，無法還原。", "error");
                return;
            }

            if (!confirm("確定要刪除你自己的修改，回到共用版本嗎？")) return;

            clearCustomData();
            usingCustom = false;
            applyData(defaultData);
            setEditorMessage("已還原成共用版本。", "ok");
        }

        function exportData() {
            const { errors, data } = buildDataFromDraft();

            if (errors.length) {
                setEditorMessage(errors.join("\n"), "error");
                return;
            }

            const blob = new Blob([JSON.stringify(data, null, 4)], { type: "application/json" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "data.json";
            link.click();
            URL.revokeObjectURL(link.href);
        }

        function importData(event) {
            const file = event.target.files[0];
            event.target.value = "";
            if (!file) return;

            const reader = new FileReader();
            reader.onload = () => {
                try {
                    const data = JSON.parse(reader.result);

                    if (!Array.isArray(data.groups)) {
                        throw new Error("檔案裡沒有 groups");
                    }

                    draft = JSON.parse(JSON.stringify({
                        settings: { ...BASE_SETTINGS, ...(data.settings || {}) },
                        groups: data.groups
                    }));
                    renderEditor();
                    setEditorMessage("已匯入，確認沒問題後請按「儲存」。", "ok");
                } catch (error) {
                    setEditorMessage(`匯入失敗：${error.message}`, "error");
                }
            };
            reader.readAsText(file);
        }

        loadJsonData();
    </script>

</body>
